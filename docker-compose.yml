version: '3.14'

services:
  flask:
    build: ./app
    container_name: hochzeit-flask
    environment:
      - FLASK_APP=flaskr:create_app
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - FLASK_RUN_PORT=80
      - FLASK_RUN_HOST=0.0.0.0
    volumes:
      - ./app:/app
    ports:
      - "80"

    command:
            - /bin/sh
            - -c
            - flask run 
  nodeJS:
          image: node:latest
          container_name: hochzeit-nodejs
          restart: unless-stopped
          volumes:
              - ./app:/app
          working_dir: /app/scripts
          command:
              - /bin/sh
              - -c
              - npm install && BROWSERSLIST_IGNORE_OLD_DATA=1 exec npm run watch
    